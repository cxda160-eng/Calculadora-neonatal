<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Calculadora Neonatal</title>
<meta name="description" content="Calculadoras de infusiones, electrolitos, sedoanalgesia, nutrición, insulina, laboratorio, cardiología, antimicrobianos, NeoFax, reanimación, bilirrubina y transfusiones para UCIN">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#202436" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calc Neonatal">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: barra superior fija con el nombre de la app y un selector de dos calculadoras; cada calculadora ocupa el resto de la pantalla */
:root{
  --bg:#f7f6fc; --surface:#ffffff; --surface-2:#eef3fb; --fg:#2e3147; --muted:#6c7090; --line:#e2e4f1;
  --inf:#2b7a72; --inf-soft:#dcf2ec; --ele:#5a8fd0; --ele-soft:#e3eefb; --sed:#ad94e4; --sed-soft:#ece6fb; --nut:#f0a37c; --nut-soft:#fde9dc; --ins:#e0679a; --ins-soft:#fde0ec; --lab:#6aa84f; --lab-soft:#dcf1cf; --ecg:#c0392b; --ecg-soft:#fde0e0; --atb:#b26a00; --atb-soft:#ffe6c2; --neo:#0e7490; --neo-soft:#cff1f8; --cre:#4f46e5; --cre-soft:#e0e1ff; --vad:#8d5b3e; --vad-soft:#f3e3d6; --ehi:#5b4fc4; --ehi-soft:#e6e3fb; --fue:#4a5878; --fue-soft:#e3e8f3; --bal:#2b6a8a; --bal-soft:#dcecf5;
  --font-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#181a27; --surface:#202436; --surface-2:#2a2f45; --fg:#eceefa; --muted:#a7abc7; --line:#363c56;
  --inf:#a6ecdc; --inf-soft:#1e3a3b; --ele:#9cc3ef; --ele-soft:#1f2f45; --sed:#c8b6f4; --sed-soft:#2c2745; --nut:#f6bb9c; --nut-soft:#3a2a26; --ins:#f6a3c4; --ins-soft:#3e2232; --lab:#b4e48f; --lab-soft:#25351f; --ecg:#ff9f9f; --ecg-soft:#3e2228; --atb:#ffc277; --atb-soft:#3d2e19; --neo:#7fd6ea; --neo-soft:#173840; --cre:#a5a1ff; --cre-soft:#2b2a52; --vad:#e7b895; --vad-soft:#3a2a20; --ehi:#b4abff; --ehi-soft:#2c2850; --fue:#b9c6e4; --fue-soft:#2a3248; --bal:#8cc4e2; --bal-soft:#1e3342; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#181a27; --surface:#202436; --surface-2:#2a2f45; --fg:#eceefa; --muted:#a7abc7; --line:#363c56;
  --inf:#a6ecdc; --inf-soft:#1e3a3b; --ele:#9cc3ef; --ele-soft:#1f2f45; --sed:#c8b6f4; --sed-soft:#2c2745; --nut:#f6bb9c; --nut-soft:#3a2a26; --ins:#f6a3c4; --ins-soft:#3e2232; --lab:#b4e48f; --lab-soft:#25351f; --ecg:#ff9f9f; --ecg-soft:#3e2228; --atb:#ffc277; --atb-soft:#3d2e19; --neo:#7fd6ea; --neo-soft:#173840; --cre:#a5a1ff; --cre-soft:#2b2a52; --vad:#e7b895; --vad-soft:#3a2a20; --ehi:#b4abff; --ehi-soft:#2c2850; --fue:#b9c6e4; --fue-soft:#2a3248; --bal:#8cc4e2; --bal-soft:#1e3342; color-scheme:dark;}
html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);display:flex;flex-direction:column;overflow:hidden}
.bar{background:var(--surface);border-bottom:1px solid var(--line);padding-top:calc(10px + env(safe-area-inset-top,0px))!important;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1rem}
.brand svg{width:30px;height:30px;flex:none}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px;flex:1;max-width:1120px;min-width:280px}
.seg .s{display:none}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;font-size:.92rem;padding:9px 8px;border-radius:9px;min-height:42px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
.seg button i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.seg button[aria-selected="true"]{background:var(--soft);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button:focus-visible{outline:3px solid var(--ele);outline-offset:2px}
.pac{background:var(--surface);border-bottom:1px solid var(--line);padding:7px max(12px,env(safe-area-inset-left,0px))}
.pac .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pac b{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.pac label{display:flex;align-items:center;gap:5px;font-size:.8rem;color:var(--muted)}
.pac input{font:600 .95rem/1 "Public Sans",system-ui,sans-serif;width:70px;padding:7px 8px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);text-align:center}
.pac input:focus{outline:2px solid var(--ele);outline-offset:1px}
.pac input.empty{border-color:#e0743c;background:#fff4ec}
.pac input.kgwarn{border-color:#c0392b;background:#ffe3e8;color:#a12d40}
.pac .u{display:flex;align-items:center;margin-left:-2px}
.pac .u .gfix{font:600 .8rem/1 "Public Sans",system-ui,sans-serif;color:var(--muted)}
.pac .u button{font:600 .8rem/1 "Public Sans",system-ui,sans-serif;border:0;background:transparent;color:var(--muted);padding:7px 8px;min-height:34px;min-width:30px;cursor:pointer}
.pac .u button[aria-pressed="true"]{background:var(--fg);color:var(--surface)}
.pac .clr .x{display:none}
.pac .clr{font:600 .76rem/1 "Public Sans",system-ui,sans-serif;border:1.5px solid var(--line);background:transparent;color:var(--muted);border-radius:9px;padding:8px 9px;cursor:pointer;margin-left:auto}
@media (max-width:640px){.pac b{display:none}.pac input{width:58px;padding:7px 4px}.pac .in{gap:6px}.pac label{gap:3px;font-size:.74rem}}
@media (max-width:420px){.pac input{width:52px}.pac .clr{padding:8px 9px}.pac .clr .t{display:none}.pac .clr .x{display:inline}.pac .in{gap:5px;flex-wrap:nowrap}.pac .u button{padding:7px 4px;min-width:24px}.pac label{gap:2px}.pac input{width:50px}}
.views{flex:1;position:relative;min-height:0}
.views iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
@media (max-width:600px){.brand span{display:none}.seg{min-width:0;max-width:none}.seg button{font-size:.82rem;padding:8px 4px;gap:5px}}
@media (max-width:900px){.brand span{display:none}}
.bar .seg{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;max-width:980px}
@media (max-width:640px){.brand{display:none}.seg .l{display:none}.seg .s{display:inline}
  .seg{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
  .seg button{font-size:.78rem;padding:7px 1px;gap:4px;min-height:38px;letter-spacing:-.02em}
  .seg button i{display:inline-block;width:7px;height:7px}}
.bar{display:none!important}
.nh{background:var(--surface);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
.nh-r{display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:1100px;width:100%;margin:0 auto}
.nh h1{margin:0;font-size:1.2rem;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.nh h1 i{width:10px;height:10px;border-radius:50%;background:var(--c,#999);display:inline-block}
.nh-b{display:flex;gap:6px}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.chip{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:42px;padding:7px 12px;border-radius:12px;border:1px solid var(--neo-soft);background:var(--neo-soft);color:var(--fg);font:inherit;text-align:left;cursor:pointer;max-width:1100px;width:100%;margin:0 auto}
.chip>span{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;font-size:.9rem}.chip span b{font-size:1rem}
.chip>b{font-size:.8rem;color:var(--neo)}
.chip.empty{background:#fff4ec;border-color:#e0743c}.chip.empty>b{color:#b0471b}
.pac{border-bottom:1px solid var(--line)}
.bn{background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
.bn button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:.7rem;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:50px;border-radius:12px;cursor:pointer;padding:4px 2px;line-height:1.1;text-align:center}
.bn button i{width:22px;height:22px;border-radius:7px;background:var(--soft);display:flex;align-items:center;justify-content:center}
.bn button i:after{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.bn button[aria-current="true"]{background:var(--soft);color:var(--fg)}
.bn button[aria-current="true"] i{background:var(--surface)}
.bn .more i{background:var(--surface-2)}.bn .more i:after{display:none}
.mas{position:fixed;inset:0;z-index:55;background:rgba(20,22,35,.5);display:flex;align-items:flex-end;justify-content:center}
.mas-in{background:var(--bg);width:min(560px,100%);max-height:calc(100dvh - 30px);overflow:auto;border-radius:22px 22px 0 0;padding:12px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.mas-h{display:flex;align-items:center;justify-content:space-between}.mas-h h2{margin:0;font-size:1.15rem}
.mas-p{margin:0;font-size:.8rem;color:var(--muted)}
.mas h3{margin:8px 0 2px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mas .g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mas .it{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;min-height:52px;padding-left:12px}
.mas .it[aria-current="true"]{border-color:var(--c);background:var(--soft)}
.mas .go{flex:1;display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--fg);font:inherit;font-weight:700;font-size:.88rem;min-height:48px;text-align:left;cursor:pointer;padding:0}
.mas .go i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.mas .st{width:42px;height:48px;border:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.mas .st[aria-pressed="true"]{color:#d99a12}
.mas-f{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:6px;font-size:.8rem;color:var(--muted)}
.mas-f button{font:inherit;font-weight:700;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
[hidden]{display:none!important}
.nacb{border:1px solid var(--line,#ddd);background:var(--surface,#fff);color:inherit;border-radius:9px;padding:6px 7px;font:inherit;font-size:.78rem;font-weight:700;cursor:pointer;white-space:nowrap;min-width:34px}
.nacb.on{background:var(--neo-soft);border-color:var(--neo);color:var(--neo)}
.nacpop{position:fixed;z-index:40;right:10px;top:150px;width:min(320px,calc(100vw - 20px));background:var(--surface,#fff);color:var(--fg,#222);border:1px solid var(--line,#ddd);border-radius:14px;padding:12px;box-shadow:0 14px 34px -10px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:8px;font-size:.85rem}
.nacpop label{display:flex;flex-direction:column;gap:4px;font-weight:600}
.nacpop input{font:inherit;font-size:1rem;padding:8px;border-radius:9px;border:1px solid var(--line,#ddd);background:var(--bg);color:inherit}
.np-r{display:flex;gap:6px}.np-r button,.bus-f button{flex:1;font:inherit;font-weight:600;padding:8px;border-radius:9px;border:1px solid var(--line,#ddd);background:var(--bg);color:inherit;cursor:pointer}
.np-r .pri{background:var(--neo);border-color:var(--neo);color:#fff}
.nacpop p{margin:0;color:var(--muted,#777);font-size:.76rem}
.seg .busb{background:var(--surface-2,rgba(255,255,255,.6));border-style:dashed}
.bus{position:fixed;inset:0;z-index:60;background:rgba(10,12,25,.45);display:flex;justify-content:center;align-items:flex-start;padding:max(10px,env(safe-area-inset-top)) 10px 10px}
.bus-in{background:var(--surface,#fff);color:var(--fg,#222);width:min(560px,100%);max-height:calc(100dvh - 20px);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 50px -15px rgba(0,0,0,.5)}
.bus-top{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--line,#ddd)}
.bus-top input{flex:1;font:inherit;font-size:1.05rem;padding:10px 12px;border-radius:11px;border:1px solid var(--line,#ddd);background:var(--bg);color:inherit}
.bus-top button{font:inherit;border:0;background:none;color:inherit;font-size:1.1rem;padding:0 8px;cursor:pointer}
.bus-r{overflow:auto;padding:6px 8px;display:flex;flex-direction:column;gap:2px;min-height:60px}
.bus-r button{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:none;color:inherit;font:inherit;padding:9px 8px;border-radius:10px;cursor:pointer}
.bus-r button:hover,.bus-r button:focus{background:var(--bg)}
.bus-r .tg{flex:none;font-size:.68rem;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--c);min-width:78px;text-align:center}
.bus-r .tx{font-size:.92rem}.bus-r .tx small{display:block;color:var(--muted,#777);font-size:.74rem}
.bus-r p{color:var(--muted,#777);font-size:.85rem;margin:10px 6px}
.bus-f{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;border-top:1px solid var(--line,#ddd);font-size:.78rem;color:var(--muted,#777)}
.bus-f button{flex:none;font-size:.78rem;padding:6px 10px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;background:#2e3147;color:#fff;padding:9px 16px;border-radius:999px;font-size:.85rem;box-shadow:0 8px 20px -8px rgba(0,0,0,.5)}
</style>
<style id="tema-vivo">
/* Tema "pastel vivo": redefine los tokens con colores más saturados, fondo con brillo de color y lectura principal con degradé */
:root{--bg:#f5f2fd;--inf:#0f9a83;--inf-soft:#bfeadb;--ele:#3a7bd5;--ele-soft:#cde3fb;--sed:#7d5fd6;--sed-soft:#ddd0fb;--nut:#e0743c;--nut-soft:#ffd6c0;--ins:#c22d6b;--ins-soft:#ffd1e3;--lab:#367a14;--lab-soft:#cdeeb6;--ecg:#b52a39;--ecg-soft:#ffd3d6;--atb:#a35400;--atb-soft:#ffdcae;--neo:#0b6c86;--neo-soft:#c4ecf6;--cre:#4338ca;--cre-soft:#dcdcff;--glow:transparent;--bar:linear-gradient(90deg,#d8f3ea 0%,#d6e6fb 30%,#e6dcfb 55%,#ffe1cf 70%,#ffd9e8 85%,#ddf3cc 100%);--surface-2:rgba(255,255,255,.65);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--glow:transparent;--bar:linear-gradient(90deg,#173a36 0%,#1b2f4d 38%,#2a2350 68%,#3a2620 70%,#3a2030 85%,#22331c 100%);--surface-2:rgba(0,0,0,.25);}}
:root[data-theme="dark"]{--glow:transparent;--bar:linear-gradient(90deg,#173a36 0%,#1b2f4d 38%,#2a2350 68%,#3a2620 70%,#3a2030 85%,#22331c 100%);--surface-2:rgba(0,0,0,.25);}
body{background:linear-gradient(180deg,var(--glow) 0,transparent 320px) no-repeat var(--bg)}
.bar{background:var(--bar);border-bottom-color:transparent}
.seg button[aria-selected="true"]{box-shadow:0 2px 8px -3px var(--c)}
</style>
</head>
<body>

<header class="nh">
  <div class="nh-r">
    <h1 id="nhT">Infusiones</h1>
    <div class="nh-b">
      <button type="button" class="ib" id="nhBus" aria-label="Buscar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
      <button type="button" class="ib" id="nhCopy" aria-label="Copiar resumen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg></button>
    </div>
  </div>
  <button type="button" class="chip" id="pChip" aria-expanded="false" aria-controls="pacRow"><span id="pSum">Cargar paciente</span><b id="pChipL">Editar</b></button>
</header>
<header class="bar">
  <div class="in">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#dcf2ec"/><path d="M32 10 L20 33 A13.5 13.5 0 1 0 44 33 Z" fill="#7fb6e3"/><rect x="29.5" y="31" width="5" height="16" rx="2" fill="#fff"/><rect x="24" y="36.5" width="16" height="5" rx="2" fill="#fff"/><circle cx="48" cy="16" r="4" fill="#ec8e9a"/></svg>
      <span>Calculadora Neonatal</span>
    </div>
    <div class="seg" role="tablist" aria-label="Calculadoras">
      <button role="tab" id="bInf" aria-selected="true" style="--c:var(--inf);--soft:var(--inf-soft)"><i></i><span class="l">Infusiones</span><span class="s">Infus.</span></button>
      <button role="tab" id="bSed" aria-selected="false" style="--c:var(--sed);--soft:var(--sed-soft)"><i></i><span class="l">Sedoanalgesia</span><span class="s">Sedo.</span></button>
      <button role="tab" id="bAtb" aria-selected="false" style="--c:var(--atb);--soft:var(--atb-soft)"><i></i><span class="l">Antimicrobianos</span><span class="s">ATB</span></button>
      <button role="tab" id="bIns" aria-selected="false" style="--c:var(--ins);--soft:var(--ins-soft)"><i></i><span class="l">Insulina</span><span class="s">Insul.</span></button>
      <button role="tab" id="bEle" aria-selected="false" style="--c:var(--ele);--soft:var(--ele-soft)"><i></i><span class="l">Electrolitos</span><span class="s">Electr.</span></button>
      <button role="tab" id="bNut" aria-selected="false" style="--c:var(--nut);--soft:var(--nut-soft)"><i></i><span class="l">Nutrición</span><span class="s">Nutric.</span></button>
      <button role="tab" id="bLab" aria-selected="false" style="--c:var(--lab);--soft:var(--lab-soft)"><i></i><span class="l">Laboratorio</span><span class="s">Lab</span></button>
      <button role="tab" id="bEcg" aria-selected="false" style="--c:var(--ecg);--soft:var(--ecg-soft)"><i></i><span class="l">Cardiología</span><span class="s">Cardio</span></button>
      <button role="tab" id="bNeo" aria-selected="false" style="--c:var(--neo);--soft:var(--neo-soft)"><i></i><span class="l">RCP · Bili · Sangre</span><span class="s">RCP+</span></button>
      <button role="tab" id="bCre" aria-selected="false" style="--c:var(--cre);--soft:var(--cre-soft)"><i></i><span class="l">Crecimiento</span><span class="s">Creci.</span></button>
      <button role="tab" id="bNfx" aria-selected="false" style="--c:var(--vad);--soft:var(--vad-soft)"><i></i><span class="l">NeoFax</span><span class="s">NeoFax</span></button>
      <button role="tab" id="bEhi" aria-selected="false" style="--c:var(--ehi);--soft:var(--ehi-soft)"><i></i><span class="l">Encefalopatía</span><span class="s">EHI</span></button>
      <button role="tab" id="bBal" aria-selected="false" style="--c:var(--bal);--soft:var(--bal-soft)"><i></i><span class="l">Balance</span><span class="s">Balance</span></button>
      <button role="tab" id="bFue" aria-selected="false" style="--c:var(--fue);--soft:var(--fue-soft)"><i></i><span class="l">Fuentes</span><span class="s">Fuentes</span></button>

<script>
const TABS={inf:["vInf","bInf"],ele:["vEle","bEle"],sed:["vSed","bSed"],nut:["vNut","bNut"],ins:["vIns","bIns"],lab:["vLab","bLab"],ecg:["vEcg","bEcg"],atb:["vAtb","bAtb"],neo:["vNeo","bNeo"],cre:["vCre","bCre"],nfx:["vNfx","bNfx"],ehi:["vEhi","bEhi"],bal:["vBal","bBal"],fue:["vFue","bFue"]};
const show=k=>{for(const [key,[v,b]] of Object.entries(TABS)){const on=key===k;
  document.getElementById(v).hidden=!on;document.getElementById(b).setAttribute("aria-selected",on)}if(window.onTab)window.onTab(k);};
document.getElementById("bInf").onclick=()=>show("inf");
document.getElementById("bEle").onclick=()=>show("ele");
document.getElementById("bSed").onclick=()=>show("sed");
document.getElementById("bNut").onclick=()=>show("nut");
document.getElementById("bIns").onclick=()=>show("ins");
document.getElementById("bLab").onclick=()=>show("lab");
document.getElementById("bEcg").onclick=()=>show("ecg");
document.getElementById("bAtb").onclick=()=>show("atb");
document.getElementById("bNeo").onclick=()=>show("neo");
document.getElementById("bCre").onclick=()=>show("cre");
document.getElementById("bNfx").onclick=()=>show("nfx");
document.getElementById("bEhi").onclick=()=>show("ehi");
document.getElementById("bBal").onclick=()=>show("bal");
document.getElementById("bFue").onclick=()=>show("fue");
if(location.hash==="#electrolitos")show("ele");
if(location.hash==="#sedoanalgesia")show("sed");
if(location.hash==="#nutricion")show("nut");
if(location.hash==="#insulina")show("ins");
if(location.hash==="#laboratorio")show("lab");
if(location.hash==="#ecg"||location.hash==="#cardiologia")show("ecg");
if(location.hash==="#antimicrobianos")show("atb");
if(location.hash==="#neo"||location.hash==="#reanimacion")show("neo");
if(location.hash==="#crecimiento")show("cre");
if(location.hash==="#neofax")show("nfx");
if(location.hash==="#ehi"||location.hash==="#encefalopatia")show("ehi");
if(location.hash==="#balance")show("bal");
if(location.hash==="#fuentes")show("fue");
try{const t=localStorage.getItem("tab");if(!location.hash&&t&&TABS[t])show(t);}catch(e){}
for(const k in TABS)document.getElementById(TABS[k][1]).addEventListener("click",()=>{try{localStorage.setItem("tab",k)}catch(e){}});

/* ---- Paciente compartido ---- */
(function(){
  const $=id=>document.getElementById(id);
  const num=s=>{const n=parseFloat(String(s).trim().replace(",","."));return isFinite(n)?n:NaN;};
  const fmt=(n,d)=>String(+n.toFixed(d)).replace(".",",");
  const unit="g"; // v35: el peso se carga siempre en gramos en toda la app
  const read=()=>{try{return JSON.parse(localStorage.getItem("pac")||"{}")||{}}catch(e){return{}}};
  const write=p=>{try{localStorage.setItem("pac",JSON.stringify(p))}catch(e){}};
  function paint(p){
    if(document.activeElement!==$("gPeso"))$("gPeso").value=p.kg>0?(unit==="g"?fmt(p.kg*1000,0):fmt(p.kg,3)):"";
    if(document.activeElement!==$("gEG"))$("gEG").value=p.eg>0?fmt(p.eg,1):"";
    const lv=live(p);
    if(document.activeElement!==$("gDias"))$("gDias").value=(lv.dias!=null&&isFinite(lv.dias))?fmt(Math.floor(lv.dias+1e-9),0):"";
    const nb=$("gNac");nb.classList.toggle("on",!!p.nac);nb.textContent=p.nac?(lv.h<168?Math.floor(lv.h)+" h":Math.floor(lv.h/24)+" d"):"🕐";
    nb.title=p.nac?"Nació: "+new Date(p.nac).toLocaleString("es-AR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"Fecha y hora de nacimiento";
    $("gPeso").classList.toggle("empty",!(p.kg>0));
    $("gU").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===unit));
    $("gPeso").placeholder="g";const wv=num($("gPeso").value);$("gPeso").classList.toggle("kgwarn",wv>0&&wv<100);$("gPeso").title=wv>0&&wv<100?"El peso va en gramos (ej.: 1500)":"";
  }
  function live(p){if(p.nac){const h=(Date.now()-Date.parse(p.nac))/36e5;if(isFinite(h)&&h>=0)return{h,dias:h/24}}return{h:null,dias:p.dias}}
  function broadcast(p,except){document.querySelectorAll(".views iframe").forEach(f=>{if(f.contentWindow&&f.contentWindow!==except)f.contentWindow.postMessage({type:"pac",pac:p},"*")});}
  function fromBar(){
    const p=read(),w=num($("gPeso").value),eg=num($("gEG").value),d=num($("gDias").value);
    p.kg=w>0?(unit==="g"?w/1000:w):null; p.eg=eg>0?eg:null;
    if(document.activeElement===$("gDias")){p.dias=isFinite(d)&&d>=0?d:null;if(p.nac){delete p.nac;paint(p)}}
    write(p);$("gPeso").classList.toggle("empty",!(p.kg>0));$("gPeso").classList.toggle("kgwarn",w>0&&w<100);$("gPeso").title=w>0&&w<100?"El peso va en gramos (ej.: 1500)":"";broadcast(p);
  }
  ["gPeso","gEG","gDias"].forEach(id=>$(id).addEventListener("input",fromBar));
  
  $("gClr").onclick=()=>{const p={};write(p);paint(p);broadcast(p);$("gPeso").focus();};
  window.addEventListener("message",e=>{if(e.data&&e.data.type==="pac-set"){write(e.data.pac);paint(e.data.pac);broadcast(e.data.pac,e.source);}});
  document.querySelectorAll(".views iframe").forEach(f=>f.addEventListener("load",()=>f.contentWindow.postMessage({type:"pac",pac:read()},"*")));
  /* hora de nacimiento */
  const toLocal=d=>{const z=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`};
  function setNac(v){const p=read();if(v){const t=new Date(v);if(isNaN(t)||t>Date.now()+6e4)return;p.nac=t.toISOString();p.dias=(Date.now()-t)/864e5}else{delete p.nac}write(p);paint(p);broadcast(p);}
  $("gNac").onclick=()=>{const pp=$("nacPop");pp.hidden=!pp.hidden;if(!pp.hidden){const p=read();$("gNacIn").value=p.nac?toLocal(new Date(p.nac)):"";const r=$("gNac").getBoundingClientRect();pp.style.top=(r.bottom+8)+"px"}};
  $("gNacIn").addEventListener("change",()=>setNac($("gNacIn").value));
  $("npNow").onclick=()=>{$("gNacIn").value=toLocal(new Date());setNac($("gNacIn").value)};
  $("npClr").onclick=()=>{$("gNacIn").value="";setNac("")};
  $("npOk").onclick=()=>{if($("gNacIn").value)setNac($("gNacIn").value);$("nacPop").hidden=true};
  let lastD=null;setInterval(()=>{const p=read();if(!p.nac)return;const d=Math.floor(live(p).dias);paint(p);if(d!==lastD){lastD=d;p.dias=live(p).dias;write(p);broadcast(p)}},60000);
  window.CalcPac={read,write,paint,broadcast};
  paint(read());
})();

/* ---- Navegación v54: título, barra inferior, menú Más, resumen del paciente, copiar ---- */
(function(){
  const $=id=>document.getElementById(id);
  const META={};for(const k in TABS){const b=$(TABS[k][1]);META[k]={n:(b.querySelector(".l")||b).textContent.trim(),s:(b.querySelector(".s")||b).textContent.trim(),st:b.getAttribute("style")||""}}
  META.neo.n="RCP · Bili · Sangre";META.ecg.s="Cardio";META.bal.s="Balance";META.ehi.s="EHI";
  const GROUPS=[["Fármacos",["inf","sed","atb","ins","nfx"]],["Cálculos",["ele","nut","lab","bal"]],["Clínica",["ecg","neo","cre","ehi"]],["Referencias",["fue"]]];
  let FAV;try{FAV=JSON.parse(localStorage.getItem("favs")||"null")}catch(e){}
  if(!Array.isArray(FAV)||!FAV.length)FAV=["inf","atb","bal","ehi"];FAV=FAV.filter(k=>TABS[k]).slice(0,4);
  let cur="inf";
  const star=on=>`<svg width="20" height="20" viewBox="0 0 24 24" fill="${on?"currentColor":"none"}" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>`;
  function go(k){show(k);try{localStorage.setItem("tab",k)}catch(e){}}
  function nav(){const bn=$("bn");bn.innerHTML="";
    FAV.forEach(k=>{const b=document.createElement("button");b.type="button";b.setAttribute("style",META[k].st);b.innerHTML=`<i></i>${META[k].s}`;b.setAttribute("aria-current",k===cur);b.onclick=()=>go(k);bn.appendChild(b)});
    const m=document.createElement("button");m.type="button";m.className="more";m.setAttribute("aria-current",!FAV.includes(cur));
    m.innerHTML=`<i><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg></i>${FAV.includes(cur)?"Más":META[cur].s}`;
    if(!FAV.includes(cur))m.setAttribute("style",META[cur].st);
    m.onclick=openMas;bn.appendChild(m)}
  function masPaint(){$("masG").innerHTML=GROUPS.map(([g,ks])=>`<h3>${g}</h3><div class="g">${ks.map(k=>`<div class="it" style="${META[k].st}" aria-current="${k===cur}"><button type="button" class="go" data-k="${k}"><i></i>${META[k].n}</button><button type="button" class="st" data-s="${k}" aria-pressed="${FAV.includes(k)}" aria-label="${FAV.includes(k)?"Quitar de":"Fijar en"} la barra: ${META[k].n}">${star(FAV.includes(k))}</button></div>`).join("")}</div>`).join("");
    $("masG").querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{closeMas();go(b.dataset.k)});
    $("masG").querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{const k=b.dataset.s;if(FAV.includes(k)){if(FAV.length>1)FAV=FAV.filter(x=>x!==k)}else{if(FAV.length>=4)FAV.shift();FAV.push(k)}try{localStorage.setItem("favs",JSON.stringify(FAV))}catch(e){}masPaint();nav()})}
  async function openMas(){masPaint();$("mas").hidden=false;$("masV").textContent=await window.appVersion()}
  function closeMas(){$("mas").hidden=true}
  $("masX").onclick=closeMas;$("mas").addEventListener("click",e=>{if(e.target.id==="mas")closeMas()});
  $("masUp").onclick=()=>$("verUp").click();
  window.onTab=k=>{cur=k;const h=$("nhT");h.innerHTML=`<i></i>${META[k].n}`;h.setAttribute("style",META[k].st);nav();try{const d=$(TABS[k][0]).contentDocument;if(d)d.title}catch(e){}};
  $("nhBus").onclick=()=>$("bBus").click();
  /* resumen del paciente */
  const fmt=(n,d)=>String(+n.toFixed(d)).replace(".",",");
  function sum(){let p={};try{p=JSON.parse(localStorage.getItem("pac")||"{}")||{}}catch(e){}
    let h=null,d=p.dias;if(p.nac){h=(Date.now()-Date.parse(p.nac))/36e5;if(h>=0)d=h/24}
    const a=[];if(p.kg)a.push(`<b>${fmt(p.kg*1000,0)} g</b>`);if(p.eg)a.push(`<span>${fmt(p.eg,1)} sem</span>`);if(d!=null&&isFinite(d))a.push(`<span>${Math.floor(d+1e-9)} días</span>`);if(h!=null&&h>=0)a.push(`<span>${Math.floor(h)} h</span>`);
    $("pSum").innerHTML=a.length?a.join(""):"Cargar peso, EG y días de vida";$("pChip").classList.toggle("empty",!p.kg)}
  function togglePac(open){const r=$("pacRow"),o=open!=null?open:r.hidden;r.hidden=!o;$("pChip").setAttribute("aria-expanded",o);$("pChipL").textContent=o?"Listo":"Editar";if(o)setTimeout(()=>{const g=$("gPeso");if(!g.value)g.focus()},30);sum()}
  $("pChip").onclick=()=>togglePac();
  window.addEventListener("message",e=>{if(e.data&&e.data.type==="pac-edit")togglePac(true);if(e.data&&e.data.type==="pac-set")setTimeout(sum,0)});
  ["gPeso","gEG","gDias"].forEach(id=>$(id).addEventListener("input",()=>setTimeout(sum,0)));
  ["npNow","npClr","npOk","gClr"].forEach(id=>$(id).addEventListener("click",()=>setTimeout(sum,0)));
  $("gNacIn").addEventListener("change",()=>setTimeout(sum,0));
  window.addEventListener("storage",e=>{if(e.key==="pac")sum()});setInterval(sum,60000);
  if(!localStorage.getItem("pac")||!JSON.parse(localStorage.getItem("pac")||"{}").kg)togglePac(true);
  /* copiar */
  async function clip(t){try{await navigator.clipboard.writeText(t);return true}catch(e){const a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.left="-9999px";document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand("copy")}catch(_){}a.remove();return ok}}
  $("nhCopy").onclick=async()=>{let t="";try{const w=$(TABS[cur][0]).contentWindow;if(w.CalcNeo&&w.CalcNeo.hasSummary&&w.CalcNeo.hasSummary())t=w.CalcNeo.buildSummary()}catch(e){}
    if(!t){toast("Esta pestaña no tiene resumen para copiar");return}
    toast(await clip(t)?"Resumen copiado":"No se pudo copiar")};
  sum();let k0="inf";for(const k in TABS)if(!$(TABS[k][0]).hidden)k0=k;window.onTab(k0);
})();

/* ---- Buscador ---- */
(function(){
  const $=id=>document.getElementById(id);
  const norm=t=>String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim();
  const NAMES={};for(const k in TABS){const b=$(TABS[k][1]);NAMES[k]={n:(b.querySelector(".l")||b).textContent.trim(),st:b.getAttribute("style")||""}}
  const STOP=/^(calcular |copiar |guardar |ver )|^(borrar|calcular|copiar|guardar|nuevo|reiniciar|pausa|seguir|listo|ahora|cerrar|ver|mas|menos|si|no|ok|—|-|\+|−|g|kg|ml|h|min)$/;
  let IDX=null;
  function build(){IDX=[];
    for(const k in TABS){let d;try{d=$(TABS[k][0]).contentDocument}catch(e){continue}if(!d||!d.body)continue;
      const seen=new Set();
      const add=(el,txt,kind,rank,extra)=>{txt=String(txt||"").replace(/\s+/g," ").trim();if(txt.length<2||txt.length>80)return;const nn=norm(txt);if(STOP.test(nn)||seen.has(kind+nn))return;seen.add(kind+nn);IDX.push(Object.assign({k,el,txt,n:nn,kind,rank},extra||{}))};
      add(null,NAMES[k].n,"tab",-1);
      const lab=e=>{const t=[...e.childNodes].filter(n=>n.nodeType===3).map(n=>n.textContent).join(" ").trim();if(t.length>=2)return t;const c=[...e.children].find(c=>c.textContent.trim().length>=2);return c?lab(c):e.textContent};
      d.querySelectorAll("h1,h2,h3,summary,legend").forEach(e=>add(e,lab(e),"sec",0));
      d.querySelectorAll("select").forEach(sel=>[...sel.options].forEach(o=>{if(o.value!=="")add(sel,o.textContent,"opt",1,{val:o.value})}));
      d.querySelectorAll("button").forEach(e=>{if(e.closest("nav,.nav"))return;add(e,lab(e),"btn",2)});
      d.querySelectorAll("table tr td:first-child,table tr th:first-child").forEach(e=>add(e,e.textContent,"row",3));
    }}
  function reveal(d,el){
    for(let a=el;a&&a!==d.body;a=a.parentElement){
      if(a.tagName==="DETAILS")a.open=true;
      if(a.hidden&&a.id&&/^view/i.test(a.id)){const v=a.id.replace(/^view/i,"").toLowerCase();const b=[...d.querySelectorAll("button[data-v]")].find(x=>x.dataset.v.toLowerCase()===v);if(b)b.click()}
    }}
  function go(r){show(r.k);try{localStorage.setItem("tab",r.k)}catch(e){}close();
    setTimeout(()=>{const d=$(TABS[r.k][0]).contentDocument,el=r.el;if(!d||!el)return;reveal(d,el);
      if(r.kind==="opt"){el.value=r.val;el.dispatchEvent(new Event("input",{bubbles:true}));el.dispatchEvent(new Event("change",{bubbles:true}))}
      else if(r.kind==="btn")el.click();
      setTimeout(()=>{el.scrollIntoView({block:"center",behavior:"smooth"});const o=el.style.outline,t=el.style.transition;el.style.transition="outline-color .6s";el.style.outline="3px solid #f0a37c";setTimeout(()=>{el.style.outline=o;el.style.transition=t},1600)},60)},30)}
  function run(){const q=norm($("busQ").value),R=$("busR");if(!q){R.innerHTML=`<p>Escribí un fármaco (vanco, adrenalina), un cálculo (MAP, GIR, QTc) o una sección (Sarnat, balance).</p>`;return}
    if(!IDX)build();const w=q.split(" ");
    const hits=IDX.filter(r=>w.every(x=>r.n.includes(x))).map(r=>({r,s:(r.n.startsWith(q)?0:r.n.split(/[^a-z0-9]/).some(t=>t.startsWith(w[0]))?1:2)*10+r.rank})).sort((a,b)=>a.s-b.s||a.r.txt.length-b.r.txt.length).slice(0,40);
    if(!hits.length){R.innerHTML=`<p>Sin resultados para «${$("busQ").value.replace(/</g,"&lt;")}».</p>`;return}
    R.innerHTML="";hits.forEach(({r})=>{const b=document.createElement("button");b.type="button";b.setAttribute("style",NAMES[r.k].st);
      b.innerHTML=`<span class="tg">${NAMES[r.k].n}</span><span class="tx">${r.txt.replace(/</g,"&lt;")}<small>${{tab:"Pestaña",sec:"Sección",opt:"Opción de lista",btn:"Botón",row:"Fila de tabla"}[r.kind]}</small></span>`;b.onclick=()=>go(r);R.appendChild(b)})}
  function open(){IDX=null;$("bus").hidden=false;$("busQ").value="";run();setTimeout(()=>$("busQ").focus(),30);verPaint()}
  function close(){$("bus").hidden=true}
  $("bBus").onclick=open;$("busX").onclick=close;$("bus").addEventListener("click",e=>{if(e.target.id==="bus")close()});
  $("busQ").addEventListener("input",run);$("busQ").addEventListener("keydown",e=>{if(e.key==="Enter"){const f=$("busR").querySelector("button");if(f)f.click()}if(e.key==="Escape")close()});
  document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();open()}});
  /* versión */
  async function verPaint(){$("verTxt").textContent=await window.appVersion()}
  $("verUp").onclick=async()=>{const b=$("verUp");b.textContent="Buscando…";try{const r=await navigator.serviceWorker.getRegistration();if(!r){b.textContent="Sin conexión";return}await r.update();b.textContent=(r.installing||r.waiting)?"Descargando versión nueva…":"Ya tenés la última"}catch(e){b.textContent="Sin conexión"}setTimeout(()=>b.textContent="Buscar actualización",3500)};
})();
</script>

<script>
window.appVersion=async()=>{try{const k=(await caches.keys()).map(x=>/^calc-neonatal-v(\d+)$/.exec(x)).filter(Boolean).map(m=>+m[1]);return k.length?"v"+Math.max(...k):"—"}catch(e){return "—"}};
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>e.hidden=true,4000)}
if("serviceWorker" in navigator){const had=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had&&!reloaded){reloaded=true;try{sessionStorage.setItem("upd","1")}catch(e){}location.reload();}});
  window.addEventListener("load",()=>{navigator.serviceWorker.register("./sw.js").then(r=>{r.update();document.addEventListener("visibilitychange",()=>{if(!document.hidden)r.update().catch(()=>{})})}).catch(()=>{})});
  try{if(sessionStorage.getItem("upd")){sessionStorage.removeItem("upd");window.addEventListener("load",async()=>toast("Calculadora actualizada a "+await window.appVersion()))}}catch(e){}}
</script>
</body>
