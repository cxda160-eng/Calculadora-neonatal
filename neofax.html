<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NeoFax</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Azeret+Mono:wght@500;700&display=swap">
<style>
body{margin:0}
/* Layout: pestaña de consulta — paciente arriba, buscador y lista; la ficha muestra cada esquema con la dosis ya calculada y la tabla EPM/EPN resaltada; acento marrón */
:root{ --bg:#f7f6fc; --surface:#ffffff; --sunk:#f8efe8; --line:#eadbcf; --fg:#2e3147; --muted:#6c7090; --accent:#8d5b3e; --accent-soft:#f3e3d6;
  --mint:#dcf2ec; --mint-fg:#2b6a60; --peach:#fff4d6; --peach-fg:#86590a; --rose:#ffe3e8; --rose-fg:#a12d40; --sky:#e6f0fb; --sky-fg:#2f5f93;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"Azeret Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){ --bg:#181a27; --surface:#202436; --sunk:#2a2f45; --line:#363c56; --fg:#eceefa; --muted:#a7abc7; --accent:#e7b895; --accent-soft:#3a2a20; --mint:#1e3a3b; --mint-fg:#a6ecdc; --peach:#3b3014; --peach-fg:#ffdc8f; --rose:#43202a; --rose-fg:#ffb9c4; --sky:#1f2f45; --sky-fg:#b5d3f5; color-scheme:dark; }}
:root[data-theme="dark"]{ --bg:#181a27; --surface:#202436; --sunk:#2a2f45; --line:#363c56; --fg:#eceefa; --muted:#a7abc7; --accent:#e7b895; --accent-soft:#3a2a20; --mint:#1e3a3b; --mint-fg:#a6ecdc; --peach:#3b3014; --peach-fg:#ffdc8f; --rose:#43202a; --rose-fg:#ffb9c4; --sky:#1f2f45; --sky-fg:#b5d3f5; color-scheme:dark; }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(40px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header h1{font-weight:700;font-size:1.25rem;letter-spacing:-.01em;margin:0}
header p{margin:4px 0 0;color:var(--muted);font-size:.88rem}
.src{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.72rem;border-radius:999px;padding:3px 10px;margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
input{font:inherit;color:var(--fg);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pac{display:flex;gap:8px}
.tile{background:var(--sunk);border-radius:12px;padding:7px 10px;display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
.tile .k{font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tile .v{font-family:var(--mono);font-size:.98rem;font-weight:700;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:.8rem;font-weight:600;padding:6px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.list{display:flex;flex-direction:column;gap:6px}
.it{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font:inherit;color:inherit;cursor:pointer}
.it .nm{font-weight:700}.it .us{font-size:.78rem;color:var(--muted)}
.it.off{background:transparent;cursor:default;border-style:dashed}
.it.off .nm{font-weight:600;color:var(--muted)}
.b{font-size:.68rem;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap;background:var(--accent-soft);color:var(--accent)}
.pill{padding:9px 12px;border-radius:10px;font-size:.85rem}
.pill.warn{background:var(--peach);color:var(--peach-fg)}.pill.crit{background:var(--rose);color:var(--rose-fg)}.pill.info{background:var(--sky);color:var(--sky-fg)}
.back{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:40px;padding:0 12px;font:inherit;font-weight:600;color:var(--fg);cursor:pointer;align-self:flex-start}
.dh h2{margin:0;font-size:1.3rem;letter-spacing:-.01em;text-transform:none;color:var(--fg)}
.reg{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.reg h3{margin:0;font-size:.98rem}
.via{font-size:.78rem;color:var(--muted)}
.res{background:var(--accent-soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.res .big{font-family:var(--mono);font-size:1.12rem;font-weight:700}
.res .sm{font-size:.8rem;color:var(--muted)}
.res.na{background:var(--sunk)}
.res.na .big{font-family:var(--body);font-size:.9rem;font-weight:600;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
tr.hit td{background:var(--mint);color:var(--mint-fg);font-weight:700}
.tw{overflow-x:auto}
.note{font-size:.84rem;color:var(--muted)}
.cin{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted)}
.cin input{width:90px;padding:6px 8px;font-family:var(--mono)}
ul.l{margin:0;padding-left:18px}ul.l li{margin:3px 0}
.hint{font-size:.78rem;color:var(--muted);margin:0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>NeoFax</h1>
    <p>Dosis neonatales calculadas para el paciente, con la página de NeoFax para verificar</p>
    <span class="src">Fuente: Micromedex NeoFax, nov. 2024 · resumen propio en castellano</span>
  </header>
  <div class="card" id="pacCard"><h2>Paciente</h2><div class="pac" id="pac"></div><p class="hint" id="pacHint">Se toma de la barra superior.</p></div>
  <main id="main"></main>
</div>
<script src="neofax-data.js?v=v62"></script>
<script src="neofax-index.js?v=v62"></script>
<script>
"use strict";
const D=window.NEOFAX, IDX=window.NEOFAX_INDEX;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const nf=(n,d=2)=>{if(!isFinite(n))return"—";const a=Math.abs(n);const dd=a>=100?0:a>=10?1:a>=1?2:3;return(+n.toFixed(Math.min(d+1,dd))).toLocaleString("es-AR",{maximumFractionDigits:3})};
let st={q:"",cat:"Todos",drug:null,conc:{}};
let P={};

/* ---------- paciente ---------- */
function readPac(){try{return JSON.parse(localStorage.getItem("pac")||"{}")||{}}catch(e){return{}}}
function setPac(p){p=p||readPac();
  const kg=p.kg>0?p.kg:null,eg=p.eg>0?p.eg:null,dias=(p.dias!=null&&isFinite(p.dias))?Math.floor(p.dias):null;
  const epmF=(eg!=null&&dias!=null)?eg+dias/7:null;
  P={kg,g:kg?kg*1000:null,eg,ga:eg!=null?Math.floor(eg):null,dias,epm:epmF!=null?Math.floor(epmF+1e-9):null,epmF,bsa:kg?0.05*kg+0.05:null};
  let epmTxt="—";if(epmF!=null){const w=Math.floor(epmF+1e-9),d=Math.round((epmF-w)*7);epmTxt=d>0&&d<7?`${w} ${d}/7`:`${w}`}
  $("#pac").innerHTML=`<div class="tile"><span class="k">Peso</span><span class="v">${kg?nf(kg*1000,0)+" g":"—"}</span></div>
   <div class="tile"><span class="k">EG</span><span class="v">${eg?nf(eg,1):"—"}</span></div>
   <div class="tile"><span class="k">EPN</span><span class="v">${dias!=null?dias+" d":"—"}</span></div>
   <div class="tile"><span class="k">EPM</span><span class="v">${epmTxt}</span></div>`;
  $("#pacHint").textContent=!kg?"Cargá el peso (y EG y días de vida) en la barra superior para calcular las dosis.":(eg==null||dias==null)?"Faltan EG o días de vida: sin ellos no se elige la fila de intervalo.":"Se toma de la barra superior. EPM = EG + días/7 (semanas cumplidas).";
  if(st.drug)ficha(st.drug,true)}
window.addEventListener("message",e=>{if(e.data&&e.data.type==="pac")setPac(e.data.pac)});
window.addEventListener("storage",e=>{if(e.key==="pac")setPac()});

/* ---------- lista ---------- */
const CATS=["Todos","Antimicrobianos","Cardiovascular","Sedoanalgesia","Neurología","Respiratorio","Otros"];
function lista(){
  $("#main").innerHTML=`<div class="card"><input id="q" type="search" placeholder="Buscar fármaco (castellano o inglés)…" value="${esc(st.q)}" autocomplete="off" aria-label="Buscar">
   <div class="chips">${CATS.map(c=>`<button class="chip" data-c="${c}" aria-pressed="${st.cat===c}">${c}</button>`).join("")}</div>
   <div class="list" id="ls"></div></div>
   <div class="card"><h2>Resto de NeoFax</h2><p class="hint">Monografías todavía sin resumir. Se van sumando por tandas; mientras tanto figura la página para consultar.</p><div class="list" id="rest"></div></div>`;
  $("#q").oninput=e=>{st.q=e.target.value;fill()};
  $$("[data-c]").forEach(b=>b.onclick=()=>{st.cat=b.dataset.c;lista()});
  fill();
  function fill(){const t=norm(st.q.trim());
    const L=D.filter(d=>(st.cat==="Todos"||d.cat===st.cat)&&(!t||norm(d.n+" "+d.en).includes(t))).sort((a,b)=>a.n.localeCompare(b.n,"es"));
    $("#ls").innerHTML=L.map(d=>`<button class="it" data-d="${d.id}"><span class="nm">${esc(d.n)}</span><span class="b">${esc(d.cat)}</span><span class="us">${esc(d.regs.map(r=>r.t).slice(0,3).join(" · "))}</span></button>`).join("")||`<p class="hint">Sin resultados entre los resumidos.</p>`;
    $$("[data-d]").forEach(b=>b.onclick=()=>{st.drug=D.find(x=>x.id===b.dataset.d);ficha(st.drug);window.scrollTo(0,0)});
    const done=new Set(D.flatMap(d=>d.en.split(" / ").map(norm)));
    const R=IDX.filter(([n])=>!done.has(norm(n))&&(!t||norm(n).includes(t)));
    $("#rest").innerHTML=R.map(([n,p])=>`<div class="it off"><span class="nm">${esc(n)}</span><span class="b" style="background:var(--sunk);color:var(--muted)">pág. ${p}</span></div>`).join("")||`<p class="hint">—</p>`;}
}

/* ---------- cálculo ---------- */
const inR=(v,r)=>r==null||(v!=null&&v>=r[0]&&v<=r[1]);
const need=r=>(r.pma&&P.epm==null)||(r.pna&&P.dias==null)||(r.ga&&P.ga==null)||(r.wt&&P.g==null);
function match(rows){if(!rows)return null;for(const r of rows){if(need(r))return undefined;if(inR(P.epm,r.pma)&&inR(P.dias,r.pna)&&inR(P.ga,r.ga)&&inR(P.g,r.wt))return r}return null}
const rng=(r,big)=>r[0]===0&&r[1]>=big?"todas":r[0]===0?`≤ ${r[1]}`:r[1]>=big?`≥ ${r[0]}`:r[0]===r[1]?`${r[0]}`:`${r[0]}–${r[1]}`;
const base=u=>u.split("/")[0];
function dstr(d,u){return d.length>1&&d[1]!==d[0]?`${nf(d[0])}–${nf(d[1])} ${u}`:`${nf(d[0])} ${u}`}
function calcLine(R,row){
  const d=(row&&row.d)||R.d, kind=R.kind||"dose", u=R.u, b=base(u);
  if(!d)return null;
  if(kind==="inf"){
    const perMin=/min$/.test(u);const conc=st.conc[R._k]!=null?st.conc[R._k]:R.conc;
    if(!P.kg)return{na:"Falta el peso"};
    const amt=d.map(x=>x*P.kg), unitAmt=b+(perMin?"/min":"/h");
    const ml=d.map(x=>x*P.kg*(perMin?60:1)/conc);
    return{big:dstr(ml,"mL/h"),sm:`${dstr(amt,unitAmt)} · con ${nf(conc)} ${R.cu}`};
  }
  if(kind==="m2"||kind==="m2day"){if(!P.kg)return{na:"Falta el peso"};const v=d.map(x=>x*P.bsa);return{big:dstr(v,b+(kind==="m2day"?"/día":"/dosis")),sm:`SC ${nf(P.bsa,2)} m² · ${R.int||R.txt||""}`}}
  if(!P.kg)return{na:"Falta el peso"};
  const v=d.map(x=>x*P.kg);
  if(kind==="day")return{big:dstr(v,b+"/día"),sm:(row&&row.txt)||R.txt||""};
  if(kind==="once")return{big:dstr(v,b),sm:"dosis única"};
  const it=row?(row.it||row.txt&&row.txt.startsWith("c/")&&row.txt||(row.i?`c/${row.i} h`:"")):(R.int||"");
  return{big:`${dstr(v,b)}${it?" "+it:""}`,sm:row&&row.txt&&!row.txt.startsWith("c/")?row.txt:""};
}
function tableHTML(R,hit){
  const rows=R.rows,has=k=>rows.some(r=>r[k]);
  const cols=[];if(has("pma"))cols.push(["EPM (sem)",r=>r.pma?rng(r.pma,99):"todas"]);if(has("ga"))cols.push(["EG (sem)",r=>r.ga?rng(r.ga,99):"todas"]);
  if(has("wt"))cols.push(["Peso (g)",r=>r.wt?rng(r.wt,99999):"todos"]);if(has("pna"))cols.push(["EPN (días)",r=>r.pna?rng(r.pna,9999):"todas"]);
  if(rows.some(r=>r.txt&&!r.txt.startsWith("c/")&&!(R.kind==="day")))cols.push(["",r=>r.txt||""]);
  if(rows.some(r=>r.d))cols.push([`Dosis (${R.u})`,r=>r.d?dstr(r.d,"").trim():""]);
  if(rows.some(r=>r.i||r.txt))cols.push(["Intervalo",r=>r.it||(R.kind==="day"?(r.txt||""):(r.txt&&r.txt.startsWith("c/")?r.txt:r.i?`c/${r.i} h`:""))]);
  return `<div class="tw"><table><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr class="${r===hit?"hit":""}">${cols.map(c=>`<td>${esc(c[1](r))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function regHTML(R,k){
  R._k=k;let body="";
  if(R.kind==="seq"){
    body=`<div class="res">${R.seq.map(s=>{const d=s.slice(1);return `<div><span class="sm">${esc(s[0])}:</span> <b class="big" style="font-size:1rem">${P.kg?dstr(d.map(x=>x*P.kg),"mg"):"—"}</b> <span class="sm">(${dstr(d,R.u)})</span></div>`}).join("")}</div>`;
  } else {
    const row=match(R.rows);
    const c=row===undefined?{na:"Cargá EG y días de vida para elegir la fila"}:(R.rows&&row===null&&!R.d)?{na:"El paciente no entra en ninguna fila de la tabla"}:calcLine(R,row);
    const per=R.kind==="inf"?"":R.d||(row&&row.d)?` <span class="sm">(${dstr((row&&row.d)||R.d,R.u)})</span>`:"";
    body=c?`<div class="res ${c.na?"na":""}"><span class="big">${c.na?esc(c.na):esc(c.big)}</span>${c.na?"":(c.sm?`<span class="sm">${esc(c.sm)}</span>`:"")}${!c.na&&per?`<span class="sm">Referencia:${per.replace(/<[^>]+>/g,"")}</span>`:""}</div>`:"";
    if(R.kind==="inf")body+=`<label class="cin">Concentración <input inputmode="decimal" data-conc="${k}" value="${String(st.conc[k]!=null?st.conc[k]:R.conc).replace(".",",")}"> ${esc(R.cu)}</label>`;
    if(R.rows)body+=tableHTML(R,row||null);
    if(!R.rows&&R.d&&R.kind!=="inf"&&c&&c.na)body+=`<div class="note">${esc(dstr(R.d,R.u))}${R.int?" · "+esc(R.int):""}${R.txt?" · "+esc(R.txt):""}</div>`;
    if(R.kind==="inf")body+=`<div class="note">Rango: ${esc(dstr(R.d,R.u))}</div>`;
  }
  return `<div class="reg"><div><h3>${esc(R.t)}</h3><div class="via">${esc(R.via||"")}</div></div>${body}${R.note?`<div class="note">${esc(R.note)}</div>`:""}</div>`}
function ficha(d,keepScroll){
  const y=window.scrollY;
  $("#main").innerHTML=`<div class="card"><button class="back" id="bk">← Lista</button>
   <div class="dh"><h2>${esc(d.n)}</h2><div class="via">${esc(d.en)} · <span class="b">NeoFax pág. ${d.pg}</span> <span class="b">${esc(d.cat)}</span></div></div>
   ${(d.warn||[]).map(w=>`<div class="pill crit">${esc(w)}</div>`).join("")}
   ${d.regs.map((R,i)=>regHTML(R,d.id+i)).join("")}
   <div class="pill warn">Resumen propio de NeoFax nov. 2024. Verificá en la pág. ${d.pg} antes de indicar, y ajustá a la clínica, la función renal y los protocolos de tu servicio.</div></div>
   ${d.adm&&d.adm.length?`<div class="card"><h2>Administración</h2><ul class="l">${d.adm.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
   ${d.prep&&d.prep.length?`<div class="card"><h2>Preparación</h2><ul class="l">${d.prep.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
   ${d.mon&&d.mon.length?`<div class="card"><h2>Controles</h2><ul class="l">${d.mon.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}`;
  $("#bk").onclick=()=>{st.drug=null;lista()};
  $$("[data-conc]").forEach(i=>i.onchange=()=>{const v=parseFloat(i.value.replace(",","."));if(v>0)st.conc[i.dataset.conc]=v;ficha(d,true)});
  if(keepScroll)window.scrollTo(0,y);
}
setPac();lista();
</script>
<script>if(window.parent!==window){const c=document.getElementById("pacCard");if(c)c.style.display="none"}</script>
</body>
</html>
