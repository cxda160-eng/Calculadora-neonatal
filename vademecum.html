<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vademécum Neonatal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Azeret+Mono:wght@500;700&display=swap">
<style>
body{margin:0}
/* Layout: pestaña de consulta — buscador e índice de fármacos con referencia a las páginas del libro y verificador de compatibilidad en Y; acento marrón */
:root{ --bg:#f7f6fc; --surface:#ffffff; --sunk:#f8efe8; --line:#eadbcf; --fg:#2e3147; --muted:#6c7090; --accent:#8d5b3e; --accent-soft:#f3e3d6;
  --mint:#dcf2ec; --mint-fg:#2b6a60; --peach:#fff4d6; --peach-fg:#86590a; --rose:#ffe3e8; --rose-fg:#a12d40; --sky:#e6f0fb; --sky-fg:#2f5f93;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"Azeret Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){ --bg:#181a27; --surface:#202436; --sunk:#2a2f45; --line:#363c56; --fg:#eceefa; --muted:#a7abc7; --accent:#e7b895; --accent-soft:#3a2a20; --mint:#1e3a3b; --mint-fg:#a6ecdc; --peach:#3b3014; --peach-fg:#ffdc8f; --rose:#43202a; --rose-fg:#ffb9c4; --sky:#1f2f45; --sky-fg:#b5d3f5; color-scheme:dark; }}
:root[data-theme="dark"]{ --bg:#181a27; --surface:#202436; --sunk:#2a2f45; --line:#363c56; --fg:#eceefa; --muted:#a7abc7; --accent:#e7b895; --accent-soft:#3a2a20; --mint:#1e3a3b; --mint-fg:#a6ecdc; --peach:#3b3014; --peach-fg:#ffdc8f; --rose:#43202a; --rose-fg:#ffb9c4; --sky:#1f2f45; --sky-fg:#b5d3f5; color-scheme:dark; }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(40px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header h1{font-weight:700;font-size:1.25rem;letter-spacing:-.01em;margin:0}
header p{margin:4px 0 0;color:var(--muted);font-size:.88rem}
.src{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.72rem;border-radius:999px;padding:3px 10px;margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;font-size:.88rem;padding:9px 6px;border-radius:9px;min-height:42px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
input,select{font:inherit;color:var(--fg);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus-visible,button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pac{display:flex;flex-wrap:wrap;gap:8px}
.tile{background:var(--sunk);border-radius:12px;padding:7px 10px;display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
.pac{flex-wrap:nowrap}
.tile .k{font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tile .v{font-family:var(--mono);font-size:1rem;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:.8rem;font-weight:600;padding:6px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.list{display:flex;flex-direction:column;gap:6px}
.it{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font:inherit;color:inherit;cursor:pointer}
.it .nm{font-weight:700}
.it .us{font-size:.78rem;color:var(--muted);grid-column:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .bd{grid-row:1/3;grid-column:2;display:flex;gap:4px}
.b{font-size:.68rem;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.b.hi{background:var(--rose);color:var(--rose-fg)}.b.tb{background:var(--sky);color:var(--sky-fg)}
.pill{padding:9px 12px;border-radius:10px;font-size:.85rem}
.pill.warn{background:var(--peach);color:var(--peach-fg)}.pill.crit{background:var(--rose);color:var(--rose-fg)}.pill.info{background:var(--sky);color:var(--sky-fg)}.pill.ok{background:var(--mint);color:var(--mint-fg)}
.back{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:40px;padding:0 12px;font:inherit;font-weight:600;color:var(--fg);cursor:pointer;align-self:flex-start}
.dh{display:flex;flex-direction:column;gap:6px}
.dh h2{margin:0;font-size:1.3rem;letter-spacing:-.01em;text-transform:none;color:var(--fg)}
.syn{color:var(--muted);font-size:.85rem}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:12px;padding:10px 14px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.btn.sec{background:var(--surface);color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
details.s{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.s summary{cursor:pointer;padding:11px 12px;font-weight:700;font-size:.92rem;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.s summary::-webkit-details-marker{display:none}
details.s summary::after{content:"＋";color:var(--muted)}
details.s[open] summary::after{content:"－"}
details.s .tx{padding:0 12px 12px;white-space:pre-line;font-size:.92rem}
.cmp{display:grid;grid-template-columns:1fr;gap:8px}
.res{display:flex;flex-direction:column;gap:8px}
.r{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start;padding:10px 12px;border-radius:12px}
.r b{font-size:1.1rem;line-height:1.2}
.r.ok{background:var(--mint);color:var(--mint-fg)}.r.no{background:var(--rose);color:var(--rose-fg)}.r.mx{background:var(--peach);color:var(--peach-fg)}.r.nd{background:var(--sunk);color:var(--muted)}
.r small{grid-column:2;font-size:.78rem;opacity:.9}
.sel{display:flex;flex-wrap:wrap;gap:6px}
.sel .chip{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.hint{font-size:.78rem;color:var(--muted);margin:0}
.lk{border:0;background:none;color:var(--accent);font:inherit;font-weight:700;text-decoration:underline;padding:2px;cursor:pointer}
.sugg{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;max-height:260px;overflow-y:auto}
.sugg button{border:0;border-bottom:1px solid var(--line);background:var(--surface);text-align:left;padding:10px 12px;font:inherit;color:var(--fg);cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Vademécum Neonatal</h1>
    <p>Guía farmacoterapéutica para el recién nacido y los primeros meses de vida</p>
    <span class="src">Fuente: Vademécum Neonatal 2019 · M. Travaglianti · Edifarma</span>
  </header>
  <div class="seg" role="group" aria-label="Sección">
    <button data-v="lista" aria-pressed="true">Fármacos</button>
    <button data-v="y" aria-pressed="false">Compatibilidad en Y</button>
  </div>
  <div class="card" id="pacCard"><h2>Paciente</h2><div class="pac" id="pac"></div><p class="hint">Se toma de la barra superior. Usá EPM y EPN para leer las tablas de dosis del libro.</p></div>
  <main id="main"></main>
</div>
<script src="vademecum-data.js"></script>
<script>
"use strict";
const V=window.VAD, D=V.drugs;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const byName=Object.fromEntries(D.map(d=>[d.n,d]));
let st={v:"lista",q:"",hi:false,drug:null,y:[]};
try{const s=JSON.parse(localStorage.getItem("vadState")||"{}");if(Array.isArray(s.y))st.y=s.y.filter(n=>byName[n]);}catch(e){}
const keep=()=>{try{localStorage.setItem("vadState",JSON.stringify({y:st.y}))}catch(e){}};

/* ---- paciente ---- */
function readPac(){try{return JSON.parse(localStorage.getItem("pac")||"{}")||{}}catch(e){return{}}}
function fmt(n,d){return String(+n.toFixed(d)).replace(".",",")}
function paintPac(p){p=p||readPac();
  const kg=p.kg>0?p.kg:null,eg=p.eg>0?p.eg:null,dias=(p.dias!=null&&isFinite(p.dias))?p.dias:null;
  let epm="—";if(eg!=null&&dias!=null){const t=eg+dias/7;const w=Math.floor(t),dd=Math.round((t-w)*7);epm=dd===7?`${w+1}`:`${w}${dd?` ${dd}/7`:""}`}
  $("#pac").innerHTML=`<div class="tile"><span class="k">Peso</span><span class="v">${kg?fmt(kg*1000,0)+" g":"—"}</span></div>
   <div class="tile"><span class="k">EG</span><span class="v">${eg?fmt(eg,1)+" sem":"—"}</span></div>
   <div class="tile"><span class="k">EPN</span><span class="v">${dias!=null?fmt(dias,0)+" d":"—"}</span></div>
   <div class="tile"><span class="k">EPM</span><span class="v">${epm}${epm!=="—"?" sem":""}</span></div>`}
window.addEventListener("message",e=>{if(e.data&&e.data.type==="pac")paintPac(e.data.pac)});
window.addEventListener("storage",e=>{if(e.key==="pac")paintPac()});
paintPac();

/* ---- navegación ---- */
$$("[data-v]").forEach(b=>b.onclick=()=>{st.v=b.dataset.v;st.drug=null;render()});
function render(){$$("[data-v]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===st.v));
  $("#pacCard").hidden=st.v==="y";
  if(st.v==="lista")st.drug?ficha(st.drug):lista();else compat();}

function lista(){
  $("#main").innerHTML=`<div class="card"><input id="q" type="search" placeholder="Buscar fármaco, sinónimo o uso…" value="${esc(st.q)}" autocomplete="off" aria-label="Buscar">
   <div class="chips"><button class="chip" id="hi" aria-pressed="${st.hi}">Solo alto riesgo</button></div>
   <div class="list" id="ls"></div><p class="hint">${D.length} monografías. Tocá un fármaco para ver usos, páginas del libro y compatibilidad en Y.</p></div>`;
  const q=$("#q");q.oninput=()=>{st.q=q.value;fill()};
  $("#hi").onclick=()=>{st.hi=!st.hi;$("#hi").setAttribute("aria-pressed",st.hi);fill()};
  fill();
  function fill(){const t=norm(st.q.trim());
    let L=D.filter(d=>!st.hi||d.alto);
    if(t){const a=L.filter(d=>norm(d.n).includes(t)),b=L.filter(d=>!a.includes(d)&&norm((d.s.sin||"")+" "+(d.s.usos||"")).includes(t));L=a.concat(b)}
    $("#ls").innerHTML=L.map(d=>`<button class="it" data-d="${esc(d.n)}"><span class="nm">${esc(d.n)}</span><span class="us">${esc((d.s.usos||d.s.sin||"").slice(0,120))}</span><span class="bd">${d.alto?'<span class="b hi">Alto riesgo</span>':""}${d.tab?'<span class="b tb">Tabla infusión</span>':""}</span></button>`).join("")||`<p class="hint">Sin resultados.</p>`;
    $$("[data-d]").forEach(b=>b.onclick=()=>{st.drug=byName[b.dataset.d];render();window.scrollTo(0,0)})}
}

const SEC=[["solv","Solventes compatibles"],["renal","Ajuste en insuficiencia renal"],["hep","Ajuste en insuficiencia hepática"],["pres","Presentación"],["cons","Conservación"]];
function ficha(d){
  const s=d.s;
  $("#main").innerHTML=`<div class="card">
   <button class="back" id="bk">← Lista</button>
   <div class="dh"><h2>${esc(d.n)}</h2>${s.sin?`<div class="syn">${esc(s.sin)}</div>`:""}
    <div class="row">${d.alto?'<span class="b hi">Medicamento de alto riesgo · doble chequeo</span>':""}<span class="b tb">Libro págs. ${d.p0}–${d.p1}</span></div></div>
   ${s.usos?`<div><b>Usos.</b> ${esc(s.usos)}</div>`:""}
   <div class="pill info"><b>Dosis, preparación y precauciones:</b> consultalas en el Vademécum Neonatal 2019, págs. ${d.p0}–${d.p1}. Usá la EPM y la EPN del paciente (arriba) para leer las tablas.${d.tab?" El libro trae además la tabla de concentraciones estandarizadas para infusión continua de este fármaco.":""}</div>
  </div>
  <div class="card"><h2>Compatibilidad en Y</h2>
   ${d.cy.length?`<div><b style="color:var(--mint-fg)">Compatibles:</b> <span class="chips">${d.cy.map(n=>`<button class="chip" data-go="${esc(n)}">${esc(n)}</button>`).join("")}</span></div>`:""}
   ${d.iy.length?`<div><b style="color:var(--rose-fg)">Incompatibles:</b> <span class="chips">${d.iy.map(n=>`<button class="chip" data-go="${esc(n)}">${esc(n)}</button>`).join("")}</span></div>`:""}
   ${!d.cy.length&&!d.iy.length?`<p class="hint">El libro no trae listas de compatibilidad en Y para este fármaco (o no se pudieron leer). Revisá el libro.</p>`:`<p class="hint">Solo fármacos con monografía en el libro. La lista completa (incluye otros fármacos) está en el libro.</p>`}
   <button class="btn sec" id="toY">Agregar al verificador de compatibilidad</button></div>
  ${SEC.some(([k])=>s[k])?`<div class="card"><h2>Datos breves</h2>
   <div class="pill warn">Leídos automáticamente de la foto del libro: pueden tener errores. Confirmá en el libro.</div>
   ${SEC.filter(([k])=>s[k]).map(([k,t])=>`<div><b>${t}.</b> ${esc(s[k])}</div>`).join("")}</div>`:""}`;
  $("#bk").onclick=()=>{st.drug=null;render()};
  $$("[data-go]").forEach(b=>b.onclick=()=>{st.drug=byName[b.dataset.go];render();window.scrollTo(0,0)});
  $("#toY").onclick=()=>{if(!st.y.includes(d.n))st.y.push(d.n);keep();st.v="y";render();window.scrollTo(0,0)};
}

/* ---- compatibilidad en Y ---- */
function pair(a,b){const A=byName[a],B=byName[b];
  const ab=A.cy.includes(b)?"c":A.iy.includes(b)?"i":null, ba=B.cy.includes(a)?"c":B.iy.includes(a)?"i":null;
  const conf=(A.cy.includes(b)&&A.iy.includes(b))||(B.cy.includes(a)&&B.iy.includes(a));
  const set=new Set([ab,ba].filter(Boolean));
  let k="nd";if(conf||set.size>1)k="mx";else if(set.has("i"))k="no";else if(set.has("c"))k="ok";
  const src=[ab?`ficha de ${a}: ${ab==="c"?"compatible":"incompatible"}`:null,ba?`ficha de ${b}: ${ba==="c"?"compatible":"incompatible"}`:null].filter(Boolean).join(" · ");
  return{k,src}}
function compat(){
  const S=st.y;
  $("#main").innerHTML=`<div class="card"><h2>Verificador de compatibilidad en Y</h2>
   <p class="hint">Elegí 2 o más fármacos que vayan por la misma vía. Se cruzan las listas de compatibilidad e incompatibilidad del libro.</p>
   <input id="yq" type="search" placeholder="Agregar fármaco…" autocomplete="off" aria-label="Agregar fármaco">
   <div class="sugg" id="ys" hidden></div>
   <div class="sel">${S.map(n=>`<button class="chip" data-rm="${esc(n)}" aria-label="Quitar ${esc(n)}">${esc(n)} ✕</button>`).join("")}</div>
   ${S.length?`<button class="lk" id="clr">Vaciar</button>`:""}
  </div>
  <div class="card"><h2>Resultado</h2><div class="res" id="res"></div>
   <div class="pill warn">Si el libro no tiene datos para un par, no deberían administrarse juntos: consultá a farmacia (criterio del propio libro). Las listas se leyeron automáticamente de fotos del libro: confirmá en el libro.</div></div>`;
  const q=$("#yq"),sg=$("#ys");
  q.oninput=()=>{const t=norm(q.value.trim());if(!t){sg.hidden=true;return}
    const L=D.filter(d=>!S.includes(d.n)&&norm(d.n).includes(t)).slice(0,8);
    sg.innerHTML=L.map(d=>`<button data-add="${esc(d.n)}">${esc(d.n)}</button>`).join("");sg.hidden=!L.length;
    $$("[data-add]").forEach(b=>b.onclick=()=>{S.push(b.dataset.add);keep();compat();$("#yq").focus()})};
  $$("[data-rm]").forEach(b=>b.onclick=()=>{st.y=S.filter(n=>n!==b.dataset.rm);keep();compat()});
  const c=$("#clr");if(c)c.onclick=()=>{st.y=[];keep();compat()};
  const R=[];for(let i=0;i<S.length;i++)for(let j=i+1;j<S.length;j++)R.push([S[i],S[j],pair(S[i],S[j])]);
  const ic={ok:"✔",no:"✖",mx:"⚠",nd:"?"},tx={ok:"Compatibles en Y",no:"Incompatibles en Y",mx:"Datos contradictorios en el libro",nd:"Sin datos en el libro"};
  $("#res").innerHTML=S.length<2?`<p class="hint">Agregá al menos dos fármacos.</p>`:R.sort((a,b)=>"nomxndok".indexOf(a[2].k)-"nomxndok".indexOf(b[2].k)).map(([a,b,r])=>`<div class="r ${r.k}"><b>${ic[r.k]}</b><span><b style="font-size:.95rem">${esc(a)} + ${esc(b)}</b> — ${tx[r.k]}</span>${r.src?`<small>${esc(r.src)}</small>`:""}</div>`).join("");
}

render();
</script>
</body>
</html>
